<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
{%- assign desc = page.description | default: site.description -%}
<meta name="description" content="{{ desc }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.collection == 'posts' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ desc }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/portrait.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="author" content="Kwabena Boateng Amponsem">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
<link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>
<div class="wrap">

  <header class="site">
    <a class="brand" href="{{ '/' | relative_url }}">Kwabena Amponsem</a>
    <nav>
      <a href="{{ '/writing/' | relative_url }}">Writing</a>
      <a href="{{ '/cv/' | relative_url }}">CV</a>
      <a href="mailto:kwabenaamponsem@gmail.com">Email</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <span>Rennes, France</span>
    <span>© {{ site.time | date: "%Y" }}</span>
  </footer>

</div>
</body>
</html>
