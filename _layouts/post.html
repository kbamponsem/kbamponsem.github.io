---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %b %Y" }}</time>{% if page.summary %} · {{ page.summary }}{% endif %}</p>

  <div class="prose">
    {{ content }}
  </div>
</article>

<p class="post-footer"><a href="{{ '/writing/' | relative_url }}">← All writing</a></p>
